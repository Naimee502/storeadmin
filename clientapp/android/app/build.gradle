subprojects {
    if (project.name == 'react-native-gesture-handler') {
        project.afterEvaluate {
            if (it.plugins.hasPlugin('com.android.library')) {
                android {
                    compileSdk 36
                }
            }
        }
    }
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

react {
    debuggableVariants = ["rudraerpDebug", "rudraerpDebugOptimized", "rknDebug", "rknDebugOptimized", "powergoldDebug", "powergoldDebugOptimized", "arsiDebug", "arsiDebugOptimized"]
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Copy the flavor's admin code into src/config/buildconfig.ts before anything builds.
def taskNames = gradle.startParameter.taskNames.join('').toLowerCase()
def activeFlavor = ['rudraerp', 'rkn', 'powergold', 'arsi'].find { taskNames.contains(it) }
if (activeFlavor) {
    def configDir = file("../../src/config")
    new File(configDir, "buildconfig.ts").text = new File(configDir, "buildconfig.${activeFlavor}.ts").text
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.app.rudraerp"
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(RUDRAERP_UPLOAD_STORE_FILE)
            storePassword RUDRAERP_UPLOAD_STORE_PASSWORD
            keyAlias RUDRAERP_UPLOAD_KEY_ALIAS
            keyPassword RUDRAERP_UPLOAD_KEY_PASSWORD
        }
        arsiRelease {
            storeFile file(ARSI_UPLOAD_STORE_FILE)
            storePassword ARSI_UPLOAD_STORE_PASSWORD
            keyAlias ARSI_UPLOAD_KEY_ALIAS
            keyPassword ARSI_UPLOAD_KEY_PASSWORD
        }
    }

    flavorDimensions "app"
    productFlavors {
        // DK — #ADM0001
        rkn {
            dimension "app"
            applicationId "com.app.rkn"
            signingConfig signingConfigs.release
            versionCode 1
            versionName "1.0"
        }
        // Arsi Agarbatti — #ADM0002 (live on Play, signed with its own key)
        arsi {
            dimension "app"
            applicationId "com.arsi.agarbatti"
            signingConfig signingConfigs.arsiRelease
            versionCode 2
            versionName "2.0"
        }
        // Rudra ERP — #ADM0003
        rudraerp {
            dimension "app"
            applicationId "com.app.rudraerp"
            signingConfig signingConfigs.release
            versionCode 2
            versionName "2.0"
        }
        // Powergold Agro Product — #ADM0004
        powergold {
            dimension "app"
            applicationId "com.app.powergoldagroproduct"
            signingConfig signingConfigs.release
            versionCode 1
            versionName "1.0"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation("com.google.android.play:app-update-ktx:2.1.0")
}
