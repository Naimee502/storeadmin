# Uploads: hand /uploads to Node instead of serving the files directly.
#
# NOT YET DEPLOYED. Paste this location block into the site's server { } block,
# replacing whatever /uploads rule is there now.
#
# ── Why ─────────────────────────────────────────────────────────────────────
# The app asks for a sized copy of every picture: resolveMediaUrl appends
# "?w=480" to a product card's image, "?w=240" to a category circle. The server
# answers those from src/utils/imagecache — sharp renders a WebP once, caches it
# on disk, and sends it with a year-long immutable Cache-Control.
#
# None of that is reached while nginx serves /uploads off the filesystem itself.
# Measured against the live site on 2026-09-15:
#
#   curl -sI ".../uploads/<file>.jpg?w=480"
#     server: nginx/1.24.0
#     content-type: image/jpeg     <- the original, not the WebP render
#     (no cache-control header at all)
#
# So every card downloads the full-size upload — 60 KB where 10 would do, and
# one of them 475 KB — and does it again on every launch, because without a
# Cache-Control header the client has nothing to go on but an ETag and asks the
# server about each picture every time.
#
# It shows up worst on the Home tab, which is simply the tab that mounts first
# and therefore pays for every download; Shop opens afterwards and draws the
# same catalogue from pictures that are already in the image cache. Nothing
# about the two screens' code differs — they render the same component.
#
# ── After deploying ─────────────────────────────────────────────────────────
#   sudo nginx -t && sudo systemctl reload nginx
#   cd server && npm run warm-images   # render every upload once, offline, so
#                                      # no customer pays for the first resize
#
# Then check that it took (both lines must appear):
#   curl -sI "https://rudra.digisysindiatech.com/uploads/1786130807611-images.jpg?w=480" \
#     | grep -i "content-type\|cache-control"
#
#   content-type: image/webp
#   cache-control: public, max-age=31536000, immutable
#
# ────────────────────────────────────────────────────────────────────────────

location /uploads/ {
    proxy_pass http://127.0.0.1:4000;   # PORT in server/ecosystem.config.js
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A cold render is sharp encoding a multi-megapixel photo, and
    # sharp.concurrency is 2, so a first-ever page of cards can queue. Node
    # falls back to serving the original if a render fails, but it should not
    # be cut off mid-encode.
    proxy_read_timeout 60s;

    # The renders are already small and WebP; re-compressing them buys nothing.
    gzip off;

    # Uploads are content-addressed in practice — names carry Date.now() and
    # the width is in the query — so a response may be held as long as nginx
    # likes. Node sends the real Cache-Control; this is only nginx's own copy.
    proxy_cache_valid 200 30d;
}

# ── If proxying is not wanted ───────────────────────────────────────────────
# Serving the files directly is still fine as a stopgap, and it fixes the
# repeat-launch half of the problem on its own — but "?w=" stays ignored, so
# every picture remains the full-size original:
#
# location /uploads/ {
#     alias /path/to/server/dist/uploads/;
#     expires 1y;
#     add_header Cache-Control "public, immutable";
#     access_log off;
# }
